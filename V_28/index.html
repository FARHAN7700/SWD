<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box {
        width: 700px;
        height: 200px;
        border: 2px solid black;
        margin: 10px;
        /* display: inline-block; */
    }
    .parent {
        border: 2px solid green;
        margin: 100px;
        height: 5000px;
    }
    .box1 {
        background-color: red;
        position: static;
        top: 100px;
    }
    .box2 {
        background-color: blue;
        /* position:relative; */
        top: 0px;
    }
    .box3 {
        background-color: green;
        position: absolute;
    }
    .box4 {
        background-color: yellow;
        position: fixed;
        top: 10px;

    }
    .box5 {
        background-color: orange;
        position: sticky;
        top: 100px;
    }

</style>
<body>
    <div class="parent">
    <div class="box box1">
        This is a simple box.
    </div>
     <div class="box box2">
        This is a simple box.
    </div>
     <div class="box box3">
        This is a simple box.
    </div>
     <div class="box box4">
        This is a simple box.
    </div>
     <div class="box box5">
        This is a simple box.
    </div>
    </div>

</body>
</html>
