<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        width: 400px;
        height: 530px;
        border: 2px solid black;
        position: relative;
        top: 30px;
        left: 430px;
        bottom: 30px;
        border-radius: 20px;
    }
    .img{
        width: 100px;
        height: 10px;
        border-radius: 20px;
    }
    #myimg{
        width: 370px;
        height: 280px;
        border-radius: 20px;
        position: relative;
        left: 13px;
        top: 13px;
    }
    .attributes{
        width: 370px;
        height: 100px;
        border-radius: 20px;
        position: relative;
        left: 13px;
        top: 280px;
        display: inline-flex;
    }
    #ocean{
        width: 80px;
        height: 20px;
        border-radius: 20px;
        text-align: center;
        /* line-height: 100px; */
        border: 0.5px solid black;
        position: relative;
        left: 10px;
    }
    #castel{
        width: 80px;
        height: 20px;
        border-radius: 20px;
        position: relative;
        left: 20px;
        border: 0.5px solid black;
         text-align: center;
        /* line-height: 100px; */
    }
    .heading{
        position: relative;
        left: 22px;
        top: 205px;

    }
    .para{
        width: 370px;
        position: relative;
        left: 22px;
        top: 200px;
        /* overflow: break-word; */
    }
    .btn{
        position: relative;
        left: 22px;
        top: 200px;
              
    }
    #learnMoreBtn{
        width: 100px;
        height: 30px;
        border-radius: 20px;
        background-color:lightblue;
        color: rgb(53, 53, 172);
        border: none;
        position: relative;
        /* align-items: center; */
        left: 122px;
    }
</style>
<body>
    <div class="box">
        <div class="img">
            <img id="myimg" src="assets/castel.jpg" alt="">
        </div>
        <div class="attributes">
            <p id="ocean">ocean</p>
            <p id="castel">castel</p>
        </div>
        <h1 class="heading">oceand and castel</h1>
        <p class="para">A beautiful castle stands near the blue ocean. The waves are calm, the air is fresh, and the view is peaceful. Birds fly above while the sunset makes the castle and ocean look magical.</p>
        <div class="btn">
            <button id="learnMoreBtn">Learn More</button>
        </div>
    </div>
</body>
</html>
